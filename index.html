<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0e14">
  <title>go2rtc Viewer Wall</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <div id="brand">
        <h1>go2rtc Viewer Wall</h1>
        <button id="g2r-url" class="url-pill" title="點擊變更 go2rtc 網址"></button>
      </div>
      <div id="controls">
        <div id="mode-group" class="mode-group">
          <button data-mode="4x4">4×4</button>
          <button data-mode="5x5" class="active">5×5</button>
          <button data-mode="6x6">6×6</button>
          <button data-mode="7x7">7×7</button>
        </div>
        <button id="btn-picker" class="primary">📷 選擇攝像頭</button>
        <button id="btn-fullscreen" title="全螢幕 (F)">⛶ 全螢幕</button>
        <span id="summary" class="summary"></span>
      </div>
    </header>

    <main id="wall-root">
      <div id="surface" class="wall-surface"></div>
    </main>

    <div id="empty-state" class="hidden">
      <div class="empty-card">
        <div class="empty-preview">
          <div class="empty-preview-grid">
            <div class="empty-preview-cell"></div>
            <div class="empty-preview-cell"></div>
            <div class="empty-preview-cell"></div>
            <div class="empty-preview-cell"></div>
            <div class="empty-preview-cell"></div>
            <div class="empty-preview-cell center"></div>
            <div class="empty-preview-cell"></div>
            <div class="empty-preview-cell"></div>
            <div class="empty-preview-cell center"></div>
            <div class="empty-preview-cell center"></div>
          </div>
        </div>
        <h2>還沒選擇任何攝像頭</h2>
        <p>點「選擇攝像頭」，從 go2rtc 挑選要顯示的串流；中間為大視窗，外圈為小視窗。</p>
        <button id="btn-empty-picker" class="primary">📷 選擇攝像頭</button>
      </div>
    </div>
  </div>

  <!-- 攝像頭選擇視窗 -->
  <div id="modal-picker" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <header class="modal-head">
        <h2>選擇攝像頭</h2>
        <button class="modal-close" data-close>✕</button>
      </header>
      <div class="modal-body">
        <div class="picker-toolbar">
          <input id="picker-search" type="search" placeholder="搜尋串流名稱…" autocomplete="off">
          <span id="picker-count" class="summary"></span>
        </div>
        <div id="picker-left">
          <div class="picker-sub">全部串流 <span id="picker-all-info"></span></div>
          <div id="stream-list" class="stream-list"></div>
        </div>
        <div id="picker-right">
          <div class="picker-sub">已選（點 ↑↓ 調整順序）</div>
          <div id="selected-list" class="stream-list selected"></div>
        </div>
      </div>
      <footer class="modal-foot">
        <button id="picker-clear">清空</button>
        <button id="picker-online">選取在線</button>
        <button id="picker-save" class="primary">套用到牆面</button>
      </footer>
    </div>
  </div>

  <!-- 設定視窗 -->
  <div id="modal-settings" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card narrow">
      <header class="modal-head">
        <h2>設定</h2>
        <button class="modal-close" data-close>✕</button>
      </header>
      <div class="modal-body">
        <label class="field">
          <span>go2rtc 網址</span>
          <input id="settings-url" type="url" spellcheck="false" placeholder="http://192.168.1.10:1984">
        </label>
        <p class="hint">使用者可自行輸入任何 go2rtc 位址；儲存後伺服器會以其為串流來源。</p>
        <div id="settings-status" class="settings-status"></div>
      </div>
      <footer class="modal-foot">
        <button id="settings-test">測試連線</button>
        <button id="settings-save" class="primary">儲存</button>
      </footer>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
